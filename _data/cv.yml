    Experience:
      - company: UNICAMP & Sorbonne University
        position: Quantum Information Researcher
        location: Campinas & Paris
        start_date: 05/2026
        end_date: Present
        summary: Research in different groups, across various topics such as quantum nonlocality, steerability classification, multipartite Bell scenarios, and quantum catalysis.
        highlights:
          - "Quantum Nonlocality & SVMs: Engineered a novel SVM pipeline to classify Local Hidden States (LHS) and quantum steerability by compressing 2-qubit density matrices into a 9-dimensional Fano feature representation. Extracted a novel algebraic formula to capture quantum nonlocality, overcame traditional LP bottlenecks by implementing convex optimisation pipelines using MOSEK, and presented findings to the UNICAMP physics department."
          - "Multipartite Bell Scenarios (paper in preparation): Defining high-dimensional polytopes and applying vertex annotation (PORTA, PANDA) to discover novel Bell inequalities. Using convex optimisation (CVXPY), linear programming, and see-saw techniques to model complex quantum correlations."
          - "Quantum Catalysis (paper in preparation): Investigating the catalytic power of quantum states across different dimensions, analysing entanglement as a novel thermodynamic and informational resource."

      - company: Self-Employed
        position: Student Job | Tutoring
        location: Paris, France
        start_date: 2025
        end_date: Present
        summary: Providing private tuition for high school students in Mathematics and English. Specialising in advanced high school calculus, pre-calculus, algebra, and standardised test preparation (SAT). Mentoring students to strengthen mathematical problem-solving skills and intuition.

      - company: Charles University
