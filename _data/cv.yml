    Quantum Information Master's Student at Sorbonne University, combining quantum dynamics with advanced machine learning
    and high-performance computing. Experienced in convex optimisation, scientific computing, and PyTorch pipelines to model complex
    quantum systems. Eager to apply my background in AI and mathematical optimisation to autonomous quantum error correction and fault-tolerant
