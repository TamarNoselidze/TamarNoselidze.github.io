        position: Quantum Information Research Intern
        location: Campinas, Brazil
        start_date: 05/2026
        end_date: Present
        highlights:
          - "Quantum Nonlocality & SVMs: Engineered a novel SVM pipeline to classify Local Hidden States (LHS) and quantum steerability by compressing 2-qubit density matrices into a 9D Fano representation. Extracted a novel algebraic formula to capture nonlocality, overcame LP bottlenecks using MOSEK, and presented findings to UNICAMP physics department. [Code]"
          - "Multipartite Bell Scenarios (Paper in preparation): Defining high-dimensional polytopes and applying vertex annotation (PORTA, PANDA) to discover novel Bell inequalities. Modelling quantum correlations via convex optimisation (CVXPY), linear programming, and see-saw techniques."
          - "Quantum Catalysis (Paper in preparation): Investigating catalytic power of quantum states across dimensions, analysing entanglement as a novel thermodynamic and informational resource."

